<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff7e6">
<title>분수 놀이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7e6;--ink:#3b2a1a;--sub:#8a6d4b;--line:#f0dcb8;--acc:#ff8f3f;--a:#ff7043;--b:#66bb6a;--c:#5c9ce6;--ok:#43a047;--bad:#e53935;--r:22px;--sh:0 6px 0 #ead9b8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:Jua,'Noto Sans KR',sans-serif;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
header{display:flex;align-items:center;gap:10px;padding:6px 16px;background:#fff;border-bottom:3px solid var(--line);flex:none}
.logo{font-size:26px}
.pill{background:#fff3dc;border-radius:999px;padding:4px 14px;font-size:20px;white-space:nowrap}
.spacer{flex:1}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.ib{font-size:24px;width:46px;height:46px;border-radius:50%;background:#fff3dc}
main{flex:1;min-height:0;position:relative}
.scr{position:absolute;inset:0;overflow:auto;padding:14px 20px;display:none;flex-direction:column}
.scr.on{display:flex}
nav{display:flex;flex:none;background:#fff;border-top:3px solid var(--line)}
nav button{flex:1;padding:6px 0 8px;font-size:17px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:0}
nav button span{font-size:26px}
nav button.on{color:var(--acc)}
.btn{background:var(--acc);color:#fff;border-radius:999px;padding:12px 30px;font-size:24px;box-shadow:0 6px 0 #c96a22}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn.g{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.btn.sm{font-size:19px;padding:8px 20px}
.btn[disabled]{opacity:.4;pointer-events:none}
/* home */
.hero{display:flex;align-items:center;gap:18px;background:#fff;border-radius:var(--r);padding:12px 22px;box-shadow:var(--sh)}
.hero h1{margin:0;font-size:30px}
.hero p{margin:4px 0 0;color:var(--sub);font-size:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:16px}
.card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px;display:flex;gap:16px;align-items:center;text-align:left;border:3px solid transparent}
.card:active{transform:translateY(4px);box-shadow:none}
.card .em{font-size:60px;line-height:1}
.card h3{margin:0;font-size:25px}
.card p{margin:4px 0 0;color:var(--sub);font-size:16px;font-family:'Noto Sans KR',sans-serif}
.card .best{margin-top:6px;font-size:16px;color:#c98a1a}
.dotsday{display:inline-flex;gap:6px;vertical-align:middle;margin-left:8px}
.dotsday i{width:14px;height:14px;border-radius:50%;background:#eadbc0;display:inline-block}
.dotsday i.f{background:#ffb300}
.sects{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:16px;flex:1;min-height:0}
.sect{background:#fff;border-radius:28px;box-shadow:0 8px 0 #ead9b8;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:4px solid transparent;min-height:260px}
.sect:active{transform:translateY(5px);box-shadow:none}
.sect .em{font-size:min(14vh,110px);line-height:1.1}
.sect h2{margin:0;font-size:44px}
.sect p{margin:0;color:var(--sub);font-size:20px}
.sect .best{font-size:18px;color:#c98a1a}
.sect.dec{background:linear-gradient(180deg,#fff,#e3f2fd)}
/* decimal parts */
.b10{display:flex;gap:4px;background:#5d4037;padding:5px;border-radius:12px;height:52px;width:min(80vw,420px);box-shadow:0 4px 0 #3e2723}
.b10 i{flex:1;border-radius:6px;background:#8d6e63;cursor:pointer}
.b10 i.f{background:var(--col);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.b10.big{width:min(84vw,760px);height:84px}
.g100{display:grid;grid-template-columns:repeat(10,1fr);gap:1px;width:140px;aspect-ratio:1;background:#c9a86a;padding:2px;border-radius:8px;flex:none}
.g100 i{background:#fffaf0;display:block;cursor:pointer}
.g100 i.f{background:var(--col)}
.g100.big{width:min(52vh,70vw)}
.g100.mid{width:min(24vh,150px)}
.g100.tiny{width:56px}
.g100.tiny2{width:96px}
.g100.pv1{width:100px}
.tenwrap{display:flex;align-items:center;justify-content:center;gap:34px;flex:1;flex-wrap:wrap}
.decin{display:inline-flex;align-items:center;gap:6px;font-size:36px}
.decin .dot{font-size:44px;line-height:1}
.pairwrap{display:flex;justify-content:center;gap:40px;flex:1;flex-wrap:wrap}
.pcol{display:flex;flex-direction:column;gap:12px;justify-content:center}
.pc{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:8px 24px;min-width:210px;min-height:70px;display:flex;align-items:center;justify-content:center;gap:14px;border:4px solid transparent;font-size:30px}
.pc.sel{border-color:var(--acc);background:#fff3dc}
.pc.ok{border-color:var(--ok);background:#f1f8e9;opacity:.75}
.dnum{font-size:34px}
.blocksArea{display:flex;gap:28px;justify-content:center;align-items:flex-end;min-height:140px;flex:1;flex-wrap:wrap}
.bk{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;justify-content:center}
.rod{display:flex;flex-direction:column;gap:1px;width:16px;height:100px;background:#c9a86a;padding:2px;border-radius:4px}
.rod i{flex:1;background:var(--a);display:block}
.bit{width:16px;height:12px;background:var(--a);border-radius:2px;border:1px solid #c9a86a}
.pvrow{display:flex;gap:16px;justify-content:center;align-items:center;flex-wrap:wrap}
.pv{background:#fff;border-radius:16px;padding:8px 14px;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;gap:6px}
.pvn{font-size:22px}.pvn small{color:var(--sub);font-size:16px}
.pvb{display:flex;align-items:center;gap:10px;font-size:28px}
.dvis{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;flex:1}
.dres{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.jugs{display:flex;gap:18px;justify-content:center;align-items:flex-end;min-height:190px;padding-top:30px}
.jug{display:flex;flex-direction:column-reverse;gap:2px;width:64px;height:150px;background:#e3f2fd;border:3px solid #90caf9;border-radius:6px 6px 16px 16px;padding:4px;position:relative}
.jug i{flex:1;border-radius:3px;display:block}
.jug i.f{background:#ffb300}
.jug span{position:absolute;top:-30px;left:50%;transform:translateX(-50%);font-size:18px;white-space:nowrap}
.card.retry{background:#fff8e1;border-color:#ffb300}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:2px 18px;width:100%}
.strow{display:flex;justify-content:space-between;gap:10px;font-size:17px;padding:3px 0;border-bottom:1px dashed var(--line)}
.pinwrap{display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:24px}
.pindots{display:flex;gap:12px}
.pindots i{width:22px;height:22px;border-radius:50%;background:#eadbc0;display:block}
.pindots i.f{background:var(--acc)}
.np.pinpad{grid-template-columns:repeat(3,80px)}
/* mascot */
.mas{width:92px;height:92px;flex:none}
.mas svg{width:100%;height:100%;overflow:visible}
.mas .m{display:none}
.mas.happy .m.happy,.mas.sad .m.sad,.mas.think .m.think,.mas.idle .m.idle{display:block}
.mas .tear{display:none}.mas.sad .tear{display:block}
.mas.happy{animation:jump .7s ease}
.mas .eye{transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px)}}
/* game */
.gtop{display:flex;align-items:center;gap:14px;flex:none;margin-bottom:6px}
.gtitle{font-size:26px}
.dots{display:flex;gap:7px;margin-left:auto}
.dots i{width:16px;height:16px;border-radius:50%;background:#eadbc0;display:block}
.dots i.cur{background:var(--acc);transform:scale(1.2)}
.dots i.done{background:#ffb300}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
.msg{text-align:center;font-size:24px;min-height:34px}
.msg b{color:var(--acc)}
.msg.bad{color:var(--bad)}
.msg.good{color:var(--ok)}
.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1;vertical-align:middle;font-size:28px}
.frac .num{padding:0 7px 3px;border-bottom:3px solid currentColor}
.frac .den{padding:3px 7px 0}
.frac.big{font-size:40px}
.frac.huge{font-size:56px}
.frac.dim{color:#b9a98f}
.eqline{display:flex;align-items:center;justify-content:center;gap:16px;font-size:36px}
.pz{display:block;width:var(--pzs,160px);height:auto}
.pzcard{display:flex;flex-direction:column;align-items:center;gap:8px}
.pzcard.wob{animation:wob .5s ease}
.pzcard.pop .pz{animation:pop .5s ease}
@keyframes wob{0%,100%{transform:rotate(0)}20%{transform:rotate(-6deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(4deg)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.shake{animation:shake .4s ease}
/* game 1 */
.eqwrap{display:flex;gap:28px;align-items:center;justify-content:center;flex:1;flex-wrap:wrap}
.target{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:14px 22px;display:flex;flex-direction:column;align-items:center;gap:8px;--pzs:min(24vw,32vh)}
.target .cap{font-size:22px;color:var(--sub)}
.qmark{width:var(--pzs);height:var(--pzs);border-radius:50%;border:4px dashed #c9a86a;display:flex;align-items:center;justify-content:center;font-size:72px;color:#c9a86a}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;--pzs:min(15vw,19vh)}
.opt{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:10px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;border:4px solid transparent;position:relative}
.opt:active{transform:translateY(4px);box-shadow:none}
.opt.ok{border-color:var(--ok);background:#f1f8e9}
.opt.no{opacity:.35;pointer-events:none}
.opt .lab{min-height:34px}
.opt .over{position:absolute;inset:10px 14px auto;display:flex;justify-content:center;pointer-events:none}
.opt .over .pz{transition:opacity .8s}
/* game 2 */
.pz3{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;--pzs:min(22vw,34vh)}
.op{font-size:48px;color:var(--sub)}
.lab{font-size:28px;min-height:60px;display:flex;align-items:center}
.lab.ok{color:var(--ok)}
.dial{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.dial button{width:64px;height:64px;border-radius:50%;background:#fff;box-shadow:var(--sh);font-size:28px}
.dial button:active{transform:translateY(4px);box-shadow:none}
.dial button.tried{opacity:.3}
.dial button.best{background:#e8f5e9;color:var(--ok)}
.center{display:flex;justify-content:center;gap:16px;align-items:center}
/* game 3 */
.shelf{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;min-height:34px}
.mini{display:flex;gap:3px;background:#5d4037;padding:4px;border-radius:9px;width:200px;height:36px;animation:pop .4s ease}
.mini i{flex:1;border-radius:4px;background:var(--col)}
.mold{display:flex;gap:5px;background:#5d4037;padding:8px;border-radius:16px;height:76px;max-width:900px;width:100%;margin:0 auto;box-shadow:0 6px 0 #3e2723}
.mold.full{animation:pop .5s ease}
.cell{flex:1;border-radius:9px;background:#8d6e63;box-shadow:inset 0 3px 6px rgba(0,0,0,.25)}
.cell.f{background:var(--col);box-shadow:inset 0 -5px 0 rgba(0,0,0,.18)}
.plates{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.plate{background:#fff;border-radius:18px;padding:10px 14px;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;gap:8px}
.plate .ph{display:flex;align-items:center;gap:12px}
.blocks{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:360px;min-height:52px}
.blk{width:52px;height:52px;border-radius:10px;background:var(--col);box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.blk:active{transform:scale(.9)}
.blk.gone{visibility:hidden}
.flying{position:fixed;z-index:50;border-radius:10px;pointer-events:none}
.simp{display:flex;align-items:center;justify-content:center;gap:14px;margin:8px 0 4px;font-size:34px}
.badge{display:inline-block;border-radius:999px;padding:1px 10px;font-size:14px;color:#fff;background:var(--acc);margin-left:8px;vertical-align:middle}
.badge.hard{background:#8e24aa}
/* cut game */
.cutwrap{display:flex;align-items:center;justify-content:center;gap:34px;flex:1;flex-wrap:wrap;--pzs:min(44vw,54vh)}
.cutwrap .pz{touch-action:none;cursor:pointer}
.cutside{display:flex;flex-direction:column;align-items:center;gap:14px;min-width:230px}
.cutinfo{font-size:24px;background:#fff;border-radius:18px;padding:12px 22px;box-shadow:var(--sh);text-align:center;line-height:1.5}
.cutgoal{font-size:22px;color:var(--sub);display:flex;align-items:center;gap:8px}
/* compare */
.cmpwrap{display:flex;justify-content:center;align-items:stretch;gap:18px;flex:1;flex-wrap:wrap;--pzs:min(18vw,30vh)}
.cmp{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:14px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:4px solid transparent;position:relative;min-width:180px}
.cmp:active{transform:translateY(4px);box-shadow:none}
.cmp.pick{border-color:var(--ok);background:#f1f8e9}
.cmp .rank{position:absolute;top:-14px;left:-10px;background:var(--acc);color:#fff;border-radius:999px;padding:4px 14px;font-size:20px}
.cmp .nolab{font-size:48px}
/* number line */
.nl{position:relative;height:150px;margin:10px 20px 0}
.nl svg{width:100%;height:100%;overflow:visible}
.frog{position:absolute;bottom:62px;font-size:54px;transform:translateX(-50%);transition:left .35s cubic-bezier(.3,1.4,.5,1);line-height:1}
.frog.hop{animation:hop .35s ease}
@keyframes hop{50%{transform:translate(-50%,-40px)}}
.fly{position:absolute;bottom:118px;font-size:36px;transform:translateX(-50%)}
.chips{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.chip{background:#fff;border-radius:999px;padding:8px 22px;box-shadow:var(--sh);font-size:24px;border:4px solid transparent;display:flex;align-items:center;gap:6px}
.chip.on{border-color:var(--acc);background:#fff3dc}
.chip.off{opacity:.35}
/* share game */
.bars{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;min-height:60px}
.bar{display:flex;gap:3px;background:#5d4037;padding:5px;border-radius:12px;width:min(300px,40vw);height:56px;box-shadow:0 5px 0 #3e2723}
.bar:active{transform:scale(.96)}
.bar i{flex:1;border-radius:6px;background:var(--col);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.friend{background:#fff;border-radius:18px;padding:10px 18px;box-shadow:var(--sh);display:flex;align-items:center;gap:14px;font-size:24px}
.friend .slots{display:flex;gap:4px}
.friend .slot{width:30px;height:44px;border-radius:7px;background:#eadbc0}
.friend .slot.f{background:var(--col)}
/* detective */
.detcase{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:20px 30px;display:flex;flex-direction:column;align-items:center;gap:16px;margin:0 auto;max-width:760px}
.detcase .eqline{font-size:42px}
.detcase .eqline .frac{font-size:40px}
.judge{display:flex;gap:18px}
.judge .btn.no{background:var(--bad);box-shadow:0 6px 0 #b71c1c}
.judge .btn.yes{background:var(--ok);box-shadow:0 6px 0 #2e7d32}
/* answer */
.anscard{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:30px;background:#fff;border-radius:var(--r);padding:12px 22px;box-shadow:var(--sh);flex-wrap:wrap}
.box{display:inline-flex;align-items:center;justify-content:center;min-width:60px;height:60px;padding:0 10px;border:3px dashed #c9a86a;border-radius:14px;background:#fffaf0;font-size:34px}
.box.act{border-style:solid;border-color:var(--acc);background:#fff3dc}
.frac .box{min-width:54px;height:50px;font-size:30px}
.mixed{display:inline-flex;align-items:center;gap:12px;font-size:30px}
.np{display:grid;grid-template-columns:repeat(6,66px);gap:8px}
.np button{height:56px;border-radius:14px;background:#fff3dc;font-size:28px;box-shadow:0 4px 0 #ead9b8}
.np button:active{transform:translateY(3px);box-shadow:none}
.np button.ok{background:var(--ok);color:#fff;box-shadow:0 4px 0 #2e7d32}
.np button.del{background:#ffe0b2}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(60,40,20,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.ov.on{display:flex}
.panel{background:#fff;border-radius:28px;padding:26px 34px;text-align:center;max-width:620px;width:100%;box-shadow:0 12px 0 #d9c3a0;animation:pop .4s ease}
.panel h2{margin:0 0 6px;font-size:34px}
.panel .stars{font-size:46px;letter-spacing:4px}
.panel .stars .off{opacity:.25;filter:grayscale(1)}
.panel .txt{font-size:24px;margin:10px 0 18px;min-height:30px}
.panel .row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.panel .mas{margin:0 auto}
/* gacha */
.gtop2{display:flex;align-items:center;gap:20px;background:#fff;border-radius:var(--r);padding:14px 22px;box-shadow:var(--sh);flex-wrap:wrap}
.gtop2 .cnt{font-size:28px}
#reveal{display:flex;justify-content:center;align-items:center;min-height:170px}
.capsule{font-size:110px;animation:wob .5s ease infinite}
.got{text-align:center;animation:pop .5s ease}
.got .e{font-size:110px;line-height:1.1}
.got .n{font-size:24px;color:var(--sub)}
.rar{display:inline-block;border-radius:999px;padding:2px 14px;font-size:18px;color:#fff;background:#90a4ae}
.rar.r2{background:#42a5f5}.rar.r3{background:linear-gradient(90deg,#ff8f3f,#e040fb)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px}
.st{background:#fff;border-radius:16px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:44px;position:relative;box-shadow:var(--sh)}
.st.lock{filter:grayscale(1);opacity:.3}
.st.r3{background:linear-gradient(135deg,#fff3dc,#fce4ec)}
.st .n{position:absolute;right:6px;bottom:4px;font-size:15px;color:var(--sub)}
.st .sp{position:absolute;left:6px;top:4px;font-size:14px}
/* adult */
.set{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:14px 22px;display:flex;align-items:center;gap:16px;margin-bottom:12px;flex-wrap:wrap}
.set h4{margin:0;font-size:22px;flex:1;min-width:160px}
.set small{display:block;color:var(--sub);font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:500}
.seg{display:flex;gap:6px}
.seg button{padding:8px 16px;border-radius:999px;background:#fff3dc;font-size:20px}
.seg button.on{background:var(--acc);color:#fff}
input.nm{font:inherit;font-size:22px;border:3px solid var(--line);border-radius:12px;padding:6px 12px;width:140px}
.conf{position:fixed;top:-20px;width:12px;height:12px;border-radius:3px;z-index:200;animation:fall 2s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.6}}
@media (max-width:760px){.np{grid-template-columns:repeat(6,52px)}.np button{height:48px;font-size:24px}.opts{--pzs:min(30vw,22vh)}.target{--pzs:min(40vw,30vh)}.pz3{--pzs:min(28vw,26vh)}.op{font-size:36px}}
</style>
</head>
<body>
<header>
  <div class="logo">🍕 분수 놀이</div>
  <div class="spacer"></div>
  <div class="pill">⭐ <span id="hStars">0</span></div>
  <div class="pill">🎟️ <span id="hTix">0</span></div>
  <button class="ib" id="sndBtn" title="소리">🔊</button>
</header>
<main>
  <section id="home" class="scr">
    <div class="hero" id="hero"></div>
    <div class="sects" id="sects"></div>
  </section>
  <section id="sec" class="scr">

  </section>

    <div class="gtop"><button class="btn g sm" id="quitBtn">◀ 그만</button><div class="gtitle" id="gTitle"></div><div class="dots" id="gDots"></div></div>
    <div id="stage"></div>
  </section>
  <section id="gacha" class="scr">
    <div class="gtop2"><div class="cnt">🎟️ 뽑기 표 <b id="gTix">0</b>장</div><button class="btn" id="drawBtn">뽑기!</button><div style="color:var(--sub);font-size:17px">별 10개를 모으면 표 1장</div></div>
    <div id="reveal"></div>

<nav>
  <button data-s="home" class="on"><span>🏠</span>홈</button>

<div class="ov" id="fb"><div class="panel" id="fbPanel"></div></div>

<script>
/* ---------- utils ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const lcm=(a,b)=>a*b/gcd(a,b);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const frac=(n,d,cls='')=>`<span class="frac ${cls}"><span class="num">${n}</span><span class="den">${d}</span></span>`;
const today=()=>new Date().toISOString().slice(0,10);
const COL=['var(--a)','var(--b)','var(--c)'];

/* ---------- state ---------- */
const KEY='frac.progress.v1';
const DEF={stars:0,tickets:0,stickers:{},today:{date:'',rounds:0,bonus:false},set:{maxD:6,input:true,sound:true,goal:3,name:'재윤'},best:{},stat:{},wrong:[]};
let S=load();
function load(){try{const o=JSON.parse(localStorage.getItem(KEY));if(o){return{...DEF,...o,set:{...DEF.set,...(o.set||{})},today:{...DEF.today,...(o.today||{})}};}}catch(e){}return JSON.parse(JSON.stringify(DEF));}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}syncHead();}
function syncHead(){$('#hStars').textContent=S.stars;$('#hTix').textContent=S.tickets;$('#gTix').textContent=S.tickets;$('#sndBtn').textContent=S.set.sound?'🔊':'🔇';}
function checkDay(){if(S.today.date!==today()){S.today={date:today(),rounds:0,bonus:false};save();}}
function addStars(n){const before=Math.floor(S.stars/10);S.stars+=n;const after=Math.floor(S.stars/10);const t=after-before;S.tickets+=t;save();return t;}

/* ---------- sound ---------- */
let AC=null;
function tone(f,t=.12,type='sine',vol=.18,when=0){if(!S.set.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,AC.currentTime+when);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+when+t);o.connect(g).connect(AC.destination);o.start(AC.currentTime+when);o.stop(AC.currentTime+when+t+.02);}catch(e){}}
const snd={tap:()=>tone(620,.07,'triangle'),pop:()=>{tone(880,.08,'triangle');tone(1320,.1,'sine',.12,.05);},ok:()=>{tone(660,.12);tone(880,.16,'sine',.18,.12);},bad:()=>tone(160,.25,'sawtooth',.12),cut:()=>{tone(300,.05,'square',.08);tone(900,.06,'square',.06,.04);},fan:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.18,i*.12)),full:()=>[784,988,1175].forEach((f,i)=>tone(f,.15,'sine',.18,i*.08))};
$('#sndBtn').onclick=()=>{S.set.sound=!S.set.sound;save();snd.tap();};

/* ---------- mascot ---------- */
const STAR=(()=>{let p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?21:46;p.push((50+r*Math.cos(a)).toFixed(1)+','+(50+r*Math.sin(a)).toFixed(1));}return p.join(' ');})();
function mascot(face='idle',size=92){return `<div class="mas ${face}" style="width:${size}px;height:${size}px"><svg viewBox="0 0 100 100"><polygon points="${STAR}" fill="#ffca28" stroke="#f9a825" stroke-width="3" stroke-linejoin="round"/><g class="eye"><circle cx="39" cy="50" r="4.5" fill="#3b2a1a"/><circle cx="61" cy="50" r="4.5" fill="#3b2a1a"/></g><circle cx="33" cy="60" r="4" fill="#ffab91" opacity=".8"/><circle cx="67" cy="60" r="4" fill="#ffab91" opacity=".8"/><path class="m happy" d="M39 61 Q50 74 61 61" fill="none" stroke="#3b2a1a" stroke-width="3.5" stroke-linecap="round"/><path class="m idle" d="M41 63 Q50 70 59 63" fill="none" stroke="#3b2a1a" stroke-width="3.5" stroke-linecap="round"/><path class="m sad" d="M40 69 Q50 60 60 69" fill="none" stroke="#3b2a1a" stroke-width="3.5" stroke-linecap="round"/><path class="m think" d="M42 66 L58 66" fill="none" stroke="#3b2a1a" stroke-width="3.5" stroke-linecap="round"/><path class="tear" d="M64 55 q5 8 0 10 q-5 -2 0 -10" fill="#64b5f6"/></svg></div>`;}

/* ---------- pizza svg ---------- */
function pz(o){const r=44,c=50,d=o.d;const pt=t=>{const a=t*2*Math.PI;return[c+r*Math.sin(a),c-r*Math.cos(a)];};
 const wedge=(t0,t1,fill)=>{if(t1-t0>=1-1e-9)return`<circle cx="${c}" cy="${c}" r="${r}" fill="${fill}"/>`;const[x0,y0]=pt(t0),[x1,y1]=pt(t1);const big=(t1-t0)>0.5?1:0;return`<path d="M${c} ${c} L${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${big} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z" fill="${fill}"/>`;};
 const lines=(k,st)=>{let z='';if(k<2)return z;for(let i=0;i<k;i++){const[x,y]=pt(i/k);z+=`<line x1="${c}" y1="${c}" x2="${x.toFixed(2)}" y2="${y.toFixed(2)}" ${st}/>`;}return z;};
 let s=`<svg viewBox="0 0 100 100" class="pz ${o.cls||''}" ${o.size?`style="width:${o.size}px"`:''}>`;
 s+=`<circle cx="${c}" cy="${c}" r="${r}" fill="${o.shadow?'#d6cfc4':o.empty?'#fffaf0':'#fde9bd'}" stroke="${o.empty?'#c9a86a':'#c99a4e'}" stroke-width="2.5" ${o.empty?'stroke-dasharray="4 3"':''}/>`;
 let t=0;for(const[n,col]of(o.parts||[])){if(n<=0)continue;const t1=t+n/d;s+=wedge(t,t1,col);t=t1;}
 if(!o.empty){s+=lines(d,`stroke="#8d5a1e" stroke-width="${o.cuts?'1':'1.6'}" stroke-opacity="${o.cuts?'.45':'.8'}"`);}
 if(o.cuts)s+=lines(o.cuts,'stroke="#3b2a1a" stroke-width="1.8"');
 if(o.misfit!=null){const[x,y]=pt(o.misfit);s+=`<line x1="${c}" y1="${c}" x2="${x.toFixed(2)}" y2="${y.toFixed(2)}" stroke="#e53935" stroke-width="3.2" stroke-dasharray="3 2"/>`;}
 if(!o.empty)s+=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#c99a4e" stroke-width="2.5"/>`;
 return s+'</svg>';}

/* ---------- screens ---------- */
function show(id){$$('.scr').forEach(e=>e.classList.toggle('on',e.id===id));$$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.s===id));if(id==='home')renderHome();if(id==='sec')renderSec();if(id==='gacha')renderGacha();if(id==='adult')renderAdult();}
$$('nav button').forEach(b=>b.onclick=()=>{snd.tap();show(b.dataset.s);});
$('#quitBtn').onclick=()=>{snd.tap();G=null;show('sec');};

function renderHome(){checkDay();const g=S.set.goal,n=S.today.rounds;
 $('#hero').innerHTML=`${mascot('idle')}<div><h1>${S.set.name}아, 오늘은 어떤 놀이?</h1><p>오늘 ${Math.min(n,g)} / ${g} 판 <span class="dotsday">${Array.from({length:g},(_,i)=>`<i class="${i<n?'f':''}"></i>`).join('')}</span>${n>=g?' 🎉 오늘 목표 달성!':''}</p></div>`;
 $('#sects').innerHTML=SECS.map(sc=>{const played=sc.games.filter(g=>S.best[g.id]).length,st=sc.games.reduce((a,g)=>a+(S.best[g.id]||0),0);return `<button class="sect ${sc.id}" data-s="${sc.id}"><div class="em">${sc.emoji}</div><h2>${sc.title}</h2><p>게임 ${sc.games.length}개 · 해 본 게임 ${played}개</p><div class="best">${st?'최고 별 합계 ⭐ '+st+' / '+sc.games.length*15:''}</div></button>`;}).join('');
 $$('.sect').forEach(b=>b.onclick=()=>{snd.tap();curSec=b.dataset.s;show('sec');});}
let curSec='frac';
function renderSec(){const sc=SECS.find(x=>x.id===curSec)||SECS[0];$('#secTitle').textContent=sc.emoji+' '+sc.title+' 놀이';
 const ids=new Set(sc.games.map(g=>g.id)),wn=S.wrong.filter(w=>ids.has(w.g)).length;
 $('#cards').innerHTML=(wn?`<button class="card retry" id="retryCard"><div class="em">🔁</div><div><h3>틀린 문제 다시</h3><p>지난번에 한 번에 못 맞힌 문제 ${wn}개를 다시 풀어요. 맞히면 목록에서 사라져요</p><div class="best">${Math.min(wn,5)}문제 한 판</div></div></button>`:'')+sc.games.map(g=>`<button class="card" data-g="${g.id}"><div class="em">${g.emoji}</div><div><h3>${g.title}${HARD.has(g.id)?'<span class="badge hard">어려움</span>':NEWG.has(g.id)&&!S.best[g.id]?'<span class="badge">NEW</span>':''}</h3><p>${g.desc}</p><div class="best">${S.best[g.id]?'최고 ⭐ '+S.best[g.id]+' / 15':'아직 안 해봤어요'}</div></div></button>`).join('');
 $$('.card[data-g]').forEach(c=>c.onclick=()=>{snd.tap();startGame(c.dataset.g);});const rc=$('#retryCard');if(rc)rc.onclick=()=>{snd.tap();startRetry(curSec);};}
$('#secBack').onclick=()=>{snd.tap();show('home');};

/* ---------- game loop ---------- */
let G=null;
function withSeed(seed,fn){const orig=Math.random;let x=seed>>>0;Math.random=()=>{x+=0x6D2B79F5;let t=x;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};try{return fn();}finally{Math.random=orig;}}
function serial(p){if(p.seed)return{seed:p.seed};const o={};for(const k in p)if(k[0]!=='_'&&k!=='retry')o[k]=p[k];return o;}
function deser(gid,sd){if(sd.seed){const f=gid==='det'?mkDet:mkDDet;const p=withSeed(sd.seed.seed,()=>f(sd.seed.type,sd.seed.ok));p.seed=sd.seed;return p;}return JSON.parse(JSON.stringify(sd));}
function startGame(id){const g=GAMES.find(x=>x.id===id);curSec=SECS.find(sc=>sc.games.includes(g)).id;const probs=g.gen();
 S.wrong.filter(w=>w.g===id).slice(-2).forEach((w,i)=>{try{const p=deser(id,w.s);p.retry=true;probs[i]=p;}catch(e){}});
 G={g,probs,i:0,stars:[]};show('game');renderRound();}
function startRetry(secId){const sc=SECS.find(x=>x.id===secId);const ids=new Set(sc.games.map(g=>g.id));const ws=S.wrong.filter(w=>ids.has(w.g)).slice(-5);if(!ws.length)return;
 const probs=[];ws.forEach(w=>{try{const p=deser(w.g,w.s);p._g=GAMES.find(x=>x.id===w.g);p.retry=true;probs.push(p);}catch(e){}});if(!probs.length)return;
 G={g:{id:'retry',emoji:'🔁',title:'틀린 문제 다시'},probs,i:0,stars:[]};show('game');renderRound();}
function renderRound(){const p=G.probs[G.i],g=p._g||G.g;$('#gTitle').innerHTML=g.emoji+' '+g.title+(p.retry?' <span class="badge" style="background:#ffb300">🔁 다시 도전</span>':'');$('#gDots').innerHTML=G.probs.map((_,i)=>`<i class="${i<G.i?'done':i===G.i?'cur':''}"></i>`).join('');$('#stage').innerHTML='';g.render(p,$('#stage'));}
function roundDone(stars,html,perfect){if(!G)return;const p=G.probs[G.i],g=p._g||G.g;const ok=perfect!=null?perfect:stars===3;
 if(g.id!=='retry'){const st=S.stat[g.id]||(S.stat[g.id]={n:0,ok:0});st.n++;if(ok)st.ok++;const key=JSON.stringify(serial(p));S.wrong=S.wrong.filter(w=>!(w.g===g.id&&w.key===key));if(!ok){S.wrong.push({g:g.id,key,s:serial(p),t:Date.now()});if(S.wrong.length>40)S.wrong.shift();}}
 G.stars.push(stars);addStars(stars);stars>=2?snd.ok():snd.pop();
 const last=G.i>=G.probs.length-1;const note=p.retry?(ok?'<div style="color:var(--ok);font-size:19px;margin-top:6px">🔁 다시 도전 성공! 틀린 문제 목록에서 지워졌어요</div>':'<div style="color:var(--sub);font-size:18px;margin-top:6px">🔁 아직 한 번에 안 됐어요. 다음에 또 만나요</div>'):(ok?'':'<div style="color:var(--sub);font-size:18px;margin-top:6px">🔁 이 문제는 다음에 한 번 더 나와요</div>');
 $('#fbPanel').innerHTML=`${mascot(stars>=2?'happy':'idle',110)}<div class="stars">${'⭐'.repeat(stars)}<span class="off">${'⭐'.repeat(3-stars)}</span></div><div class="txt">${html||''}${note}</div><div class="row"><button class="btn" id="nextBtn">${last?'결과 보기':'다음 ▶'}</button></div>`;
 $('#fb').classList.add('on');
 $('#nextBtn').onclick=()=>{snd.tap();$('#fb').classList.remove('on');if(!G)return;if(last)results();else{G.i++;renderRound();}};}
function results(){const tot=G.stars.reduce((a,b)=>a+b,0),mx=G.probs.length*3;checkDay();S.today.rounds++;let bonus=[];
 if(tot===mx){S.tickets++;bonus.push('⭐ 만점 보너스 🎟️ +1');}
 if(S.today.rounds>=S.set.goal&&!S.today.bonus){S.today.bonus=true;S.tickets++;bonus.push('오늘 목표 달성 🎟️ +1');}
 if(G.g.id!=='retry'&&(S.best[G.g.id]||0)<tot)S.best[G.g.id]=tot;save();snd.fan();confetti();
 $('#fbPanel').innerHTML=`${mascot('happy',120)}<h2>한 판 끝!</h2><div class="stars">⭐ ${tot} / ${mx}</div><div class="txt">${bonus.join('<br>')||(tot>=12?'정말 잘했어!':'좋아, 다음엔 더 잘할 거야!')}<br><span style="color:var(--sub);font-size:19px">가진 별 ${S.stars}개 · 뽑기 표 ${S.tickets}장</span></div><div class="row"><button class="btn g" id="rAgain">다시 하기</button><button class="btn g" id="rHome">목록</button>${S.tickets>0?'<button class="btn" id="rGacha">🎁 뽑기 가기</button>':''}</div>`;
 const gid=G.g.id;G=null;$('#fb').classList.add('on');
 $('#rAgain').onclick=()=>{snd.tap();$('#fb').classList.remove('on');if(gid==='retry')startRetry(curSec);else startGame(gid);};
 $('#rHome').onclick=()=>{snd.tap();$('#fb').classList.remove('on');show('sec');};
 const gb=$('#rGacha');if(gb)gb.onclick=()=>{snd.tap();$('#fb').classList.remove('on');show('gacha');};}
function confetti(){const cols=['#ff7043','#ffca28','#66bb6a','#42a5f5','#ab47bc','#ec407a'];for(let i=0;i<50;i++){const e=document.createElement('i');e.className='conf';e.style.left=Math.random()*100+'vw';e.style.background=pick(cols);e.style.animationDelay=(Math.random()*.6)+'s';e.style.animationDuration=(1.6+Math.random())+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),3000);}}

/* ---------- answer card (numpad) ---------- */
function makeAnswer(el,n,layout,onSubmit,maxs=[]){const vals=Array(n).fill('');let act=0;
 const draw=()=>{const bx=vals.map((v,i)=>`<span class="box ${i===act?'act':''}" data-i="${i}">${v}</span>`);
  el.innerHTML=`<div class="anscard"><div class="ansL">${layout(bx)}</div><div class="np">${[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(k=>`<button data-k="${k}" class="${k==='✓'?'ok':k==='⌫'?'del':''}">${k}</button>`).join('')}</div></div>`;
  $$('.box',el).forEach(b=>b.onclick=()=>{act=+b.dataset.i;draw();});
  $$('.np button',el).forEach(b=>b.onclick=()=>{const k=b.dataset.k;snd.tap();
   if(k==='⌫'){if(vals[act])vals[act]=vals[act].slice(0,-1);else if(act>0){act--;vals[act]=vals[act].slice(0,-1);}}
   else if(k==='✓'){if(vals.every(v=>v!==''))onSubmit(vals.map(Number));else{el.firstElementChild.classList.remove('shake');void el.offsetWidth;el.firstElementChild.classList.add('shake');}return;}
   else{if(vals[act].length<2)vals[act]+=k;const lim=(maxs[act]!=null&&maxs[act]<10)?1:2;if(vals[act].length>=lim&&act<n-1)act++;}
   draw();});};
 draw();return{shake(){el.firstElementChild.classList.remove('shake');void el.offsetWidth;el.firstElementChild.classList.add('shake');},clear(){vals.fill('');act=0;draw();}};}

/* ---------- GAME 1: 같은 크기 찾기 ---------- */
const EQ={id:'eq',emoji:'🔍',title:'같은 크기 찾기',desc:'그림자와 똑같은 크기의 피자 조각을 찾아요. 2/4 = 1/2!',
 gen(){const maxD=S.set.maxD;const bases=[[1,2],[1,3],[2,3],[1,4],[3,4],[1,5],[2,5],[3,5],[4,5],[1,6],[5,6]].filter(([a,b])=>b*2<=12&&b<=Math.max(maxD,4));const probs=[],used=new Set();
  for(let r=0;r<5;r++){let t,g=0;do{t=pick(bases);}while(used.has(t.join('/'))&&g++<50);used.add(t.join('/'));
   const ks=[];for(let k=2;k*t[1]<=12;k++)ks.push(k);const k=pick(ks);const cor=[t[0]*k,t[1]*k];
   const bad=(n,d)=>n>=1&&n<d&&d>=2&&d<=12&&n*t[1]!==t[0]*d;
   const opts=[cor];const add=(n,d)=>{if(bad(n,d)&&!opts.some(o=>o[0]*d===n*o[1]))opts.push([n,d]);};
   add(cor[0]+(Math.random()<.5?1:-1),cor[1]);add(cor[0],cor[1]+(Math.random()<.5?1:2));let guard=0;
   while(opts.length<4&&guard++<500){const d=rnd(3,12);add(rnd(1,d-1),d);}
   shuffle(opts);probs.push({t,cor,opts,mode:r<2?0:r<4?1:2});}
  return probs;},
 render(p,el){let tries=0;const[a,b]=p.t;const showLab=p.mode===0;
  el.innerHTML=`<div class="msg">${p.mode===2?`<b>${a}/${b}</b> 와 크기가 <b>똑같은</b> 피자는?`:'회색 그림자와 크기가 <b>똑같은</b> 피자는?'}</div>
  <div class="eqwrap"><div class="target"><div class="cap">${p.mode===2?'이 분수와 같은 것은?':'그림자'}</div>${p.mode===2?`<div class="qmark">${frac(a,b,'huge')}</div>`:pz({d:b,parts:[[a,'#8d8578']],shadow:true})}${p.mode===2?'':`<div class="lab">${frac(a,b,'big')}</div>`}</div>
  <div class="opts">${p.opts.map((o,i)=>`<button class="opt" data-i="${i}">${pz({d:o[1],parts:[[o[0],COL[0]]]})}<div class="lab">${showLab?frac(o[0],o[1]):''}</div></button>`).join('')}</div></div>`;
  $$('.opt',el).forEach(btn=>btn.onclick=async()=>{const o=p.opts[+btn.dataset.i];const ok=o[0]*b===a*o[1];
   if(!ok){tries++;snd.bad();btn.classList.add('shake');await sleep(400);btn.classList.add('no');$('.msg',el).innerHTML=`음... ${frac(o[0],o[1])} 는 ${o[0]*b>a*o[1]?'더 커요':'더 작아요'}. 다시 찾아 봐!`;return;}
   snd.cut();$$('.opt',el).forEach(x=>{if(x!==btn)x.classList.add('no');});btn.classList.add('ok');
   const over=document.createElement('div');over.className='over';over.innerHTML=pz({d:b,parts:[[a,COL[0]]]});btn.appendChild(over);
   $('.lab',btn).innerHTML=`${frac(o[0],o[1])} = ${frac(a,b)}`;$('.msg',el).innerHTML=`딱 맞아! 조각을 합치면 <b>${a}/${b}</b> 가 돼요`;
   const stars=tries===0?3:tries===1?2:1;await sleep(1300);
   roundDone(stars,`${frac(o[0],o[1],'big')} <span style="font-size:36px">=</span> ${frac(a,b,'big')}<br>${o[1]/b}조각씩 합치면 같은 크기!`);});}
};

/* ---------- GAME 2: 조각 맞추기 (통분 덧셈) ---------- */
const ADD={id:'add',emoji:'🍕',title:'조각 맞추기',desc:'크기가 다른 피자 조각을 똑같이 잘라서 더해요',
 gen(){const maxD=Math.max(S.set.maxD,4);const probs=[],seen=new Set();let divCnt=0,guard=0;
  const pairs=new Set();let twos=0;
  while(probs.length<5&&guard++<4000){const b=rnd(2,maxD),d=rnd(2,maxD);if(b===d)continue;const L=lcm(b,d);if(L>12)continue;
   const a=rnd(1,b-1),c=rnd(1,d-1);if(gcd(a,b)!==1||gcd(c,d)!==1)continue;if(a*d+c*b>b*d)continue;
   const pk=Math.min(b,d)+'-'+Math.max(b,d);const relaxed=guard>2500;
   if(!relaxed&&pairs.has(pk))continue;if(!relaxed&&(b===2||d===2)&&twos>=2)continue;
   const div=(b%d===0||d%b===0);if(div&&divCnt>=2&&!relaxed)continue;const key=`${a}/${b}+${c}/${d}`;if(seen.has(key))continue;seen.add(key);pairs.add(pk);if(b===2||d===2)twos++;if(div)divCnt++;
   probs.push({a,b,c,d,L});}
  return probs;},
 render(p,el){const{a,b,c,d,L}=p;let wrong=0,base=3,D=0;
  el.innerHTML=`<div class="pz3"><div class="pzcard" id="pA">${pz({d:b,parts:[[a,COL[0]]]})}<div class="lab" id="lA">${frac(a,b)}</div></div><div class="op">+</div><div class="pzcard" id="pB">${pz({d:d,parts:[[c,COL[1]]]})}<div class="lab" id="lB">${frac(c,d)}</div></div><div class="op">=</div><div class="pzcard" id="pR">${pz({d:1,empty:true})}<div class="lab" id="lR" style="color:#b9a98f;font-size:40px">?</div></div></div>
  <div class="msg" id="msg">조각 크기가 달라서 바로 못 더해요. 두 피자를 <b>몇 등분</b>으로 자르면 둘 다 딱 맞을까? 숫자를 써 봐</div>
  <div id="dialIn"></div><div class="center" id="dialBtn"></div><div id="ans"></div>`;
  const msg=(h,cls='')=>{const m=$('#msg',el);m.className='msg '+cls;m.innerHTML=h;};let inp=null;
  function askD(){inp=makeAnswer($('#dialIn',el),1,bx=>`<span style="font-size:28px">두 피자를</span>${bx[0]}<span style="font-size:28px">등분</span>`,v=>{const k=v[0];if(k<2||k>12){inp.shake();inp.clear();msg('2부터 12까지 중에서 생각해 봐','bad');return;}tryD(k);},[12]);}
  askD();
  function tryD(k){D=k;snd.cut();const fA=(D*a)%b===0,fB=(D*c)%d===0;
   $('#pA',el).innerHTML=pz({d:b,parts:[[a,COL[0]]],cuts:D,misfit:fA?null:a/b})+`<div class="lab ${fA?'ok':''}">${fA?frac(D*a/b,D):frac(a,b)}</div>`;
   $('#pB',el).innerHTML=pz({d:d,parts:[[c,COL[1]]],cuts:D,misfit:fB?null:c/d})+`<div class="lab ${fB?'ok':''}">${fB?frac(D*c/d,D):frac(c,d)}</div>`;
   if(fA&&fB){if(base!==1)base=D===L?3:2;$('#dialIn',el).innerHTML='';$('#dialBtn',el).innerHTML=`<button class="btn" id="merge">합치기 ▶</button>`;
    msg(D===L?`<b>${D}등분</b>이면 둘 다 딱 맞아! 이제 합쳐 보자`:`${D}등분도 맞긴 해요. 사실 <b>${L}등분</b>만 해도 딱 맞아요. 합쳐 보자!`,'good');
    $('#merge',el).onclick=()=>merge();}
   else{wrong++;const who=!fA&&!fB?'두 피자 모두':!fA?'왼쪽 피자가':'오른쪽 피자가';
    [[fA,'#pA'],[fB,'#pB']].forEach(([f,id])=>{if(!f){const e=$(id,el);e.classList.remove('wob');void e.offsetWidth;e.classList.add('wob');}});
    snd.bad();if(inp)inp.clear();
    if(wrong>=3){base=1;$('#dialIn',el).innerHTML='';$('#dialBtn',el).innerHTML=`<button class="btn" id="useL">${L}등분으로 잘라 보기</button>`;msg(`정답은 <b>${L}등분</b>이에요. ${b}의 배수이면서 ${d}의 배수인 가장 작은 수! 눌러서 확인해 봐`,'bad');$('#useL',el).onclick=()=>tryD(L);}
    else if(wrong===2)msg(`${D}등분이면 ${who} 안 나눠져요. 왼쪽은 <b>${b}</b>등분, 오른쪽은 <b>${d}</b>등분이에요. ${b}의 배수(${[b,2*b,3*b,4*b].filter(x=>x<=12).join(', ')}) 중에서 ${d}로도 나눠지는 수는?`,'bad');
    else msg(`${D}등분이면 ${who} 딱 나눠지지 않아요 <span style="color:var(--bad)">(빨간 선)</span>. 다른 수를 생각해 봐`,'bad');}}
  async function merge(){snd.pop();const n1=D*a/b,n2=D*c/d,sum=n1+n2;$('#dialBtn',el).innerHTML='';
   const R=$('#pR',el);R.innerHTML=pz({d:D,parts:[[n1,COL[0]],[n2,COL[1]]]})+`<div class="lab" id="lR"></div>`;R.classList.add('pop');
   let stars=Math.max(1,base-wrong);
   const finish=()=>{$('#lR',el).innerHTML=frac(sum,D,'big');const g=gcd(sum,D);let extra='';if(sum===D)extra='<br>피자 한 판이 꽉 찼어요! = 1';else if(g>1)extra=`<div class="simp">${pz({d:D,parts:[[sum,COL[0]]],size:110})}<span>=</span>${pz({d:D/g,parts:[[sum/g,COL[0]]],size:110})}</div>같은 크기를 더 큰 조각으로: ${frac(sum,D)} = ${frac(sum/g,D/g)} (더 간단한 모양)`;
    msg(`정답! ${frac(n1,D)} + ${frac(n2,D)} = ${frac(sum,D)}`,'good');
    roundDone(stars,`<span class="eqline">${frac(a,b,'big')} + ${frac(c,d,'big')} = ${frac(sum,D,'big')}</span>${extra}`);};
   if(!S.set.input){await sleep(700);finish();return;}
   msg('합친 피자는 몇 조각? 색칠된 조각을 세어 봐!');
   const A=makeAnswer($('#ans',el),1,bx=>`<span class="frac big"><span class="num">${bx[0]}</span><span class="den">${D}</span></span>`,v=>{
    if(v[0]===sum){$('#ans',el).innerHTML='';finish();}else{stars=Math.max(1,stars-1);snd.bad();A.shake();A.clear();msg(`다시 세어 봐: 주황 <b>${n1}</b>조각 + 초록 <b>${n2}</b>조각`,'bad');}});}}
};

/* ---------- GAME 3: 초콜릿 한 판 넘기기 (가분수→대분수) ---------- */
const OVER={id:'over',emoji:'🍫',title:'한 판 넘기기',desc:'조각을 모아 초콜릿 한 판을 채우고 남은 조각을 세어요',
 gen(){const maxD=Math.max(S.set.maxD,4);const probs=[];for(let r=0;r<5;r++){const b=rnd(3,maxD);const k=r<2?2:3;let terms,sum,g=0;
  do{terms=[];for(let i=0;i<k;i++)terms.push(rnd(1,b-1));sum=terms.reduce((x,y)=>x+y,0);}while((sum<=b||sum%b===0)&&g++<200);
  probs.push({b,terms,sum});}return probs;},
 render(p,el){const{b,terms,sum}=p;let placed=0,tries=0,busy=false;const total=sum;
  el.innerHTML=`<div class="eqline">${terms.map((t,i)=>`<span style="color:${COL[i]}">${frac(t,b)}</span>`).join('<span class="op">+</span>')}<span class="op">=</span><span style="color:#b9a98f">?</span></div>
  <div class="msg" id="msg">조각을 눌러서 초콜릿 틀에 넣어 봐. 한 판이 꽉 차면 어떻게 될까?</div>
  <div class="shelf" id="shelf"></div><div class="mold" id="mold">${Array.from({length:b},()=>'<div class="cell"></div>').join('')}</div>
  <div class="plates">${terms.map((t,i)=>`<div class="plate" data-t="${i}"><div class="ph"><span style="color:${COL[i]}">${frac(t,b)}</span><button class="btn g sm all" data-t="${i}">모두 넣기</button></div><div class="blocks">${Array.from({length:t},()=>`<button class="blk" data-t="${i}" style="--col:${COL[i]}"></button>`).join('')}</div></div>`).join('')}</div><div id="ans"></div>`;
  const msg=(h,cls='')=>{const m=$('#msg',el);m.className='msg '+cls;m.innerHTML=h;};
  async function moveBlock(blk){if(blk.classList.contains('gone'))return;const col=blk.style.getPropertyValue('--col');const cells=$$('#mold .cell',el);const idx=placed%b;const cell=cells[idx];
   const r0=blk.getBoundingClientRect(),r1=cell.getBoundingClientRect();blk.classList.add('gone');
   const fly=document.createElement('div');fly.className='flying';fly.style.cssText=`left:${r0.left}px;top:${r0.top}px;width:${r0.width}px;height:${r0.height}px;background:${col}`;document.body.appendChild(fly);snd.tap();
   await fly.animate([{transform:'translate(0,0)'},{transform:`translate(${r1.left+r1.width/2-r0.left-r0.width/2}px,${r1.top+r1.height/2-r0.top-r0.height/2}px) scale(${r1.width/r0.width},${r1.height/r0.height})`}],{duration:380,easing:'cubic-bezier(.3,.8,.4,1)'}).finished;
   fly.remove();cell.classList.add('f');cell.style.setProperty('--col',col);placed++;
   if(placed%b===0){const mold=$('#mold',el);mold.classList.add('full');snd.full();msg(`<b>${b}/${b}</b> 꽉 찼다! 초콜릿 <b>한 판</b> 완성 🍫`,'good');await sleep(650);
    const mini=document.createElement('div');mini.className='mini';mini.innerHTML=cells.map(c=>`<i style="--col:${c.style.getPropertyValue('--col')}"></i>`).join('');$('#shelf',el).appendChild(mini);
    cells.forEach(c=>{c.classList.remove('f');c.style.removeProperty('--col');});mold.classList.remove('full');}
   if(placed===total)done();}
  $$('.blk',el).forEach(bk=>bk.onclick=async()=>{if(busy)return;busy=true;await moveBlock(bk);busy=false;});
  $$('.all',el).forEach(bt=>bt.onclick=async()=>{if(busy)return;busy=true;bt.disabled=true;for(const bk of $$(`.blk[data-t="${bt.dataset.t}"]`,el)){await moveBlock(bk);await sleep(60);}busy=false;});
  function done(){const W=Math.floor(total/b),n=total%b;const whole=W===1?'한 판':W+'판';
   const finish=(stars)=>{$('#ans',el).innerHTML='';$('.eqline span:last-child',el).innerHTML=`<span class="mixed" style="color:var(--ok)">${W} ${frac(n,b)}</span>`;
    roundDone(stars,`<span class="eqline">${terms.map(t=>frac(t,b,'big')).join(' + ')} = <span class="mixed" style="font-size:40px">${W}${frac(n,b,'big')}</span></span>가분수로 쓰면 ${frac(total,b)} 이에요`);};
   if(!S.set.input){msg(`초콜릿 ${whole}과 ${n}조각! = <b>${W}</b>과 <b>${n}/${b}</b>`,'good');setTimeout(()=>finish(3),900);return;}
   msg('초콜릿 몇 판과 몇 조각이 됐을까?');
   const A=makeAnswer($('#ans',el),2,bx=>`<span class="mixed">${bx[0]}<span>판 과</span><span class="frac"><span class="num">${bx[1]}</span><span class="den">${b}</span></span><span>조각</span></span>`,v=>{
    if(v[0]===W&&v[1]===n){finish(tries===0?3:tries===1?2:1);}
    else{tries++;snd.bad();A.shake();A.clear();msg(v[0]!==W?`완성된 초콜릿 판(위 선반)을 세어 봐!`:`틀에 남아 있는 조각을 세어 봐!`,'bad');}},[W,b-1]);}}
};
/* ---------- GAME 4: 피자 자르기 (직접 선 긋기·지우기 → 동치분수·약분) ---------- */
const UNIT=24;
function cutSVG(o){const r=44,c=50;const pt=(t,rr=r)=>{const a=t*2*Math.PI;return[c+rr*Math.sin(a),c-rr*Math.cos(a)];};
 const wedge=(t0,t1,fill)=>{const[x0,y0]=pt(t0),[x1,y1]=pt(t1);const big=(t1-t0)>0.5?1:0;return`<path d="M${c} ${c} L${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${big} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z" fill="${fill}"/>`;};
 let s=`<svg viewBox="0 0 100 100" class="pz" id="cutSvg"><circle cx="${c}" cy="${c}" r="${r+5}" fill="transparent"/><circle cx="${c}" cy="${c}" r="${r}" fill="#fde9bd" stroke="#c99a4e" stroke-width="2.5"/>`;
 s+=wedge(0,o.a/o.b,COL[0]);
 for(let i=0;i<UNIT;i++){const[x,y]=pt(i/UNIT,r+3);s+=`<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="1.1" fill="#c9a86a"/>`;}
 for(const p of o.cuts){const fx=o.fixed.has(p);const[x,y]=pt(p/UNIT,fx?r:r+3);s+=`<line x1="${c}" y1="${c}" x2="${x.toFixed(2)}" y2="${y.toFixed(2)}" stroke="${fx?'#3b2a1a':o.equal?'#2e7d32':'#5d4037'}" stroke-width="${fx?3.2:2.2}" stroke-linecap="round"/>`;}
 s+=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#c99a4e" stroke-width="2.5"/></svg>`;return s;}
const CUT={id:'cut',emoji:'✂️',title:'피자 자르기',desc:'피자에 직접 선을 긋거나 지워서 같은 크기 분수를 만들어요. 4/8 = 1/2!',
 gen(){const fine=[[1,2],[1,3],[2,3],[1,4],[3,4],[1,6],[5,6]];
  const mk=(mode,kmin,kmax)=>{let t,k,g=0;do{t=pick(fine);const ks=[];for(let kk=kmin;kk<=kmax;kk++)if(t[1]*kk<=12&&UNIT%(t[1]*kk)===0)ks.push(kk);k=ks.length?pick(ks):null;}while(!k&&g++<60);if(!k){t=[1,2];k=2;}return{mode,a:t[0],b:t[1],k};};
  return[mk('fine',2,3),mk('fine',2,4),mk('coarse',2,2),mk('coarse',2,3),mk('coarse',3,4)];},
 render(p,el){const{mode,a,b,k}=p;const D=b*k;const fixed=new Set([0,a*UNIT/b]);const cuts=new Set(fixed);
  const start=mode==='coarse'?D:b;for(let i=0;i<start;i++)cuts.add(i*UNIT/start);
  const tD=mode==='fine'?D:b;const target=new Set();for(let i=0;i<tD;i++)target.add(i*UNIT/tD);
  let wrong=0,done=false;
  el.innerHTML=`<div class="msg" id="msg">${mode==='fine'?`피자를 <b>똑같은 크기 ${D}조각</b>으로 잘라서 ${frac(a,b)} 와 같은 분수를 만들어 봐. 피자 가장자리를 누르면 선이 그어져요.`:`선을 지워서 <b>가장 큰 조각</b>으로 만들어 봐. 조각은 모두 같은 크기여야 해요. 선 끝을 누르면 지워져요.`}</div>
  <div class="cutwrap"><div class="pzcard" id="cutPz"></div><div class="cutside"><div class="cutgoal">${mode==='fine'?`목표: ${frac(a,b)} = ${frac('?',D)}`:`시작: ${frac(a*k,D)} → 더 간단히?`}</div><div class="cutinfo" id="info"></div><div class="lab" id="cutLab"></div></div></div>`;
  const msg=(h,cls='')=>{const m=$('#msg',el);m.className='msg '+cls;m.innerHTML=h;};
  function draw(){const arr=[...cuts].sort((x,y)=>x-y);const n=arr.length;const equal=arr.every((v,i)=>v===i*UNIT/n);
   $('#cutPz',el).innerHTML=cutSVG({a,b,cuts:arr,fixed,equal});
   $('#info',el).innerHTML=`조각 <b>${n}</b>개<br>${equal?'<span style="color:var(--ok)">모두 같은 크기 ✓</span>':'<span style="color:var(--bad)">크기가 달라요 ✗</span>'}`;
   $('#cutLab',el).innerHTML=equal?`${frac(a*n/b,n,'big')} <span style="font-size:30px">=</span> ${frac(a,b,'big')}`:`<span class="frac big dim"><span class="num">?</span><span class="den">?</span></span>`;
   const svg=$('#cutSvg',el);svg.onpointerdown=e=>{if(done)return;e.preventDefault();const rc=svg.getBoundingClientRect();const x=e.clientX-rc.left-rc.width/2,y=e.clientY-rc.top-rc.height/2;if(Math.hypot(x,y)>rc.width*.6)return;
    let t=Math.atan2(x,-y)/(2*Math.PI);if(t<0)t+=1;const q=Math.round(t*UNIT)%UNIT;
    if(fixed.has(q)){const pc=$('#cutPz',el);pc.classList.remove('wob');void pc.offsetWidth;pc.classList.add('wob');msg('굵은 선은 색칠한 부분의 경계라서 지울 수 없어요','bad');return;}
    if(cuts.has(q)){cuts.delete(q);if(target.has(q))wrong++;snd.tap();}else{cuts.add(q);if(!target.has(q))wrong++;snd.cut();}
    const st=draw();check(st.n,st.equal);};
   return{n,equal};}
  function check(n,equal){if(!equal){if(mode==='fine')msg(`조각 크기가 달라요. 똑같은 크기 <b>${D}조각</b>이 되게 해 봐`);else msg('조각 크기가 달라졌어요. 모두 같은 크기가 되게 지워 봐');return;}
   if(n===tD){done=true;snd.ok();const stars=wrong===0?3:wrong<=2?2:1;
    msg(mode==='fine'?`딱 맞아! ${frac(a*k,D)} = ${frac(a,b)}`:`이게 제일 간단한 모양! ${frac(a*k,D)} = ${frac(a,b)}`,'good');
    const before=mode==='fine'?[a,b]:[a*k,D],after=mode==='fine'?[a*k,D]:[a,b];
    setTimeout(()=>roundDone(stars,`<div class="simp">${pz({d:before[1],parts:[[before[0],COL[0]]],size:120})}<span>=</span>${pz({d:after[1],parts:[[after[0],COL[0]]],size:120})}</div>${frac(before[0],before[1],'big')} = ${frac(after[0],after[1],'big')}<br><span style="font-size:19px;color:var(--sub)">${mode==='fine'?`조각을 ${k}배 잘게 잘라도 색칠한 크기는 그대로예요`:`같은 크기를 더 큰 조각으로 쓰면 더 간단해요 (위아래 ÷${k})`}</span>`),900);return;}
   if(mode==='fine')msg(`${n}조각도 모두 같은 크기네! 이번엔 <b>${D}조각</b>으로 해 보자 (${frac(a*n/b,n)} = ${frac(a,b)})`,'good');
   else msg(`${frac(a*n/b,n)} 도 같은 크기! 그런데 <b>더 큰 조각</b>으로 할 수 있을까?`,'good');}
  draw();}
};

/* ---------- GAME 5: 누가 더 커 (크기 비교·순서) ---------- */
const CMP={id:'cmp',emoji:'⚖️',title:'누가 더 커',desc:'분수의 크기를 비교하고 큰 순서대로 골라요',
 gen(){const maxD=Math.max(S.set.maxD,6);const val=f=>f[0]/f[1];const probs=[];
  for(let r=0;r<5;r++){const k=3;const fs=[];let g=0;while(fs.length<k&&g++<300){const d=rnd(2,maxD),n=rnd(1,d-1);const f=[n,d];if(fs.some(x=>Math.abs(val(x)-val(f))<0.09||x[1]===d))continue;fs.push(f);}
   while(fs.length<k)fs.push([1,fs.length+5]);probs.push({fs,pics:r<3,k});}return probs;},
 render(p,el){const{fs,pics,k}=p;const val=f=>f[0]/f[1];const order=fs.map((f,i)=>i).sort((i,j)=>val(fs[j])-val(fs[i]));let next=0,tries=0;
  el.innerHTML=`<div class="msg" id="msg">${k===2?'어느 쪽이 더 <b>커</b>? 큰 쪽을 눌러 봐':'<b>큰 것부터</b> 차례로 눌러 봐'}${pics?'':' (머릿속으로 피자를 떠올려 봐)'}</div>
  <div class="cmpwrap">${fs.map((f,i)=>`<button class="cmp" data-i="${i}">${pics?pz({d:f[1],parts:[[f[0],COL[i]]]}):''}<div class="${pics?'lab':'nolab'}">${frac(f[0],f[1],pics?'':'huge')}</div></button>`).join('')}</div>`;
  $$('.cmp',el).forEach(btn=>btn.onclick=async()=>{const i=+btn.dataset.i;if(btn.classList.contains('pick'))return;
   if(i===order[next]){snd.pop();btn.classList.add('pick');btn.insertAdjacentHTML('afterbegin',`<span class="rank">${k===2?'더 커!':next+1+'등'}</span>`);next++;
    if(next>=(k===2?1:k)){const stars=tries===0?3:tries===1?2:1;await sleep(700);

 gen(){const ds=[2,3,4,5,6,8].filter(d=>d<=Math.max(S.set.maxD,5));const probs=[];

/* ---------- GAME 7: 초콜릿 나눠 주기 (뺄셈·받아내림) ---------- */
const SUB={id:'sub',emoji:'🎁',title:'초콜릿 나눠 주기',desc:'친구에게 초콜릿을 나눠 주고 남은 양을 세어요. 모자라면 한 판을 쪼개요',
 gen(){const maxD=Math.max(S.set.maxD,4);const probs=[];for(let r=0;r<5;r++){const b=rnd(3,maxD);const W=r<3?1:rnd(1,2);let n,c;if(r<2){n=rnd(2,b-1);c=rnd(1,n);}else{n=rnd(0,b-2);c=rnd(n+1,b-1);}probs.push({b,W,n,c});}return probs;},
 render(p,el){const{b,W,n,c}=p;let given=0,bars=W,pieces=n,tries=0,busy=false,done=false;const total=W*b+n-c,RW=Math.floor(total/b),Rn=total%b;

  const msg=(h,cls='')=>{const m=$('#msg',el);m.className='msg '+cls;m.innerHTML=h;};
  const bindBlk=bk=>bk.onclick=async()=>{if(busy||done)return;if(given>=c){msg('고마워, 이제 충분해! 남은 양은 얼마일까?','good');return;}busy=true;
   const slot=$$('#slots .slot',el)[given];const r0=bk.getBoundingClientRect(),r1=slot.getBoundingClientRect();bk.classList.add('gone');
   const fly=document.createElement('div');fly.className='flying';fly.style.cssText=`left:${r0.left}px;top:${r0.top}px;width:${r0.width}px;height:${r0.height}px;background:var(--a)`;document.body.appendChild(fly);snd.tap();
   await fly.animate([{transform:'translate(0,0)'},{transform:`translate(${r1.left+r1.width/2-r0.left-r0.width/2}px,${r1.top+r1.height/2-r0.top-r0.height/2}px) scale(${r1.width/r0.width},${r1.height/r0.height})`}],{duration:380,easing:'cubic-bezier(.3,.8,.4,1)'}).finished;
   fly.remove();slot.classList.add('f');slot.style.setProperty('--col','var(--a)');given++;pieces--;bk.remove();busy=false;
   if(given===c){snd.full();msg('고마워! 😊 그럼 초콜릿이 얼마나 남았을까?','good');await sleep(500);ask();}};

   msg(`한 판을 ${b}조각으로 쪼갰어요! 이제 조각을 줄 수 있어요`);});
  function ask(){const A=makeAnswer($('#ans',el),2,bx=>`<span class="mixed">${bx[0]}<span>판 과</span><span class="frac"><span class="num">${bx[1]}</span><span class="den">${b}</span></span><span>조각 남았어</span></span>`,v=>{
    if(v[0]===RW&&v[1]===Rn){done=true;$('#ans',el).innerHTML='';const stars=tries===0?3:tries===1?2:1;
     roundDone(stars,`<span class="eqline"><span class="mixed">${W}${n?frac(n,b,'big'):''}</span> − ${frac(c,b,'big')} = <span class="mixed" style="font-size:40px">${RW||''}${Rn?frac(Rn,b,'big'):RW?'':'0'}</span></span>${c>n?`<span style="font-size:19px;color:var(--sub)">조각이 모자라서 한 판(${b}/${b})을 쪼갰어요</span>`:''}`);}
    else{tries++;snd.bad();A.shake();A.clear();msg(v[0]!==RW?'남은 <b>통째 판</b>이 몇 개인지 세어 봐':'남은 <b>조각</b>을 세어 봐','bad');}},[RW,b-1]);}}

/* ---------- GAME 8: 분수 탐정 (틀린 계산 찾기) ---------- */
function mkDet(type,ok){const maxD=Math.max(S.set.maxD,6);let st,fix,ans,why,layout,check,pic='';
 const F=(n,d)=>frac(n,d);
 if(type===1){const b=rnd(3,maxD),a=rnd(1,b-2),c=rnd(1,b-1-a);const mkS=f=>`${F(a,b)} + ${F(c,b)} = ${f?F(a+c,b):F(a+c,2*b)}`;st=mkS(ok);fix=mkS(true);ans=[a+c,b];why='분모는 조각 크기라서 그대로! 조각 수(분자)만 더해요';
  layout=bx=>`${F(a,b)} + ${F(c,b)} = <span class="frac big"><span class="num">${bx[0]}</span><span class="den">${bx[1]}</span></span>`;check=v=>v[0]*ans[1]===ans[0]*v[1];
  pic=`<div class="simp">${pz({d:b,parts:[[a,COL[0]]],size:90})}<span>+</span>${pz({d:b,parts:[[c,COL[1]]],size:90})}<span>=</span>${pz({d:b,parts:[[a,COL[0]],[c,COL[1]]],size:90})}</div>`;}
 else if(type===2){let b,d,a,c,L,g=0;do{b=rnd(2,6);d=rnd(2,6);a=rnd(1,b-1);c=rnd(1,d-1);L=lcm(b,d);}while((b===d||L>12||gcd(a,b)!==1||gcd(c,d)!==1||a*d+c*b>b*d)&&g++<300);
  const sum=a*L/b+c*L/d;const mkS=f=>`${F(a,b)} + ${F(c,d)} = ${f?F(sum,L):F(a+c,b+d)}`;st=mkS(ok);fix=mkS(true);ans=[sum,L];why=`조각 크기가 다르면 먼저 ${L}등분으로 똑같이 자른 다음 더해요`;
  layout=bx=>`${F(a,b)} + ${F(c,d)} = <span class="frac big"><span class="num">${bx[0]}</span><span class="den">${bx[1]}</span></span>`;check=v=>v[0]*ans[1]===ans[0]*v[1];
  pic=`<div class="simp">${pz({d:b,parts:[[a,COL[0]]],cuts:L,size:90})}<span>+</span>${pz({d:d,parts:[[c,COL[1]]],cuts:L,size:90})}<span>=</span>${pz({d:L,parts:[[a*L/b,COL[0]],[c*L/d,COL[1]]],size:90})}</div>`;}
 else if(type===3){const base=pick([[1,2],[1,3],[2,3],[1,4],[3,4]]);const k=rnd(2,3);const[a,b]=base;const wrongD=b+(Math.random()<.5?1:-1);
  const mkS=f=>`${F(a*k,b*k)} 를 간단히 하면 ${f?F(a,b):F(a,wrongD)}`;st=mkS(ok);fix=mkS(true);ans=[a,b];why=`간단히 할 때는 위아래를 <b>같은 수(${k})</b>로 나눠요. 조각을 합쳐도 크기는 그대로!`;
  layout=bx=>`${F(a*k,b*k)} = <span class="frac big"><span class="num">${bx[0]}</span><span class="den">${bx[1]}</span></span>`;check=v=>v[0]===a&&v[1]===b;
  pic=`<div class="simp">${pz({d:b*k,parts:[[a*k,COL[0]]],size:100})}<span>=</span>${pz({d:b,parts:[[a,COL[0]]],size:100})}</div>`;}
 else if(type===4){const base=pick([[1,2],[1,3],[2,3],[1,4],[3,4],[2,5]]);const k=rnd(2,3);const[a,b]=base;
  const mkS=f=>`${F(a,b)} = ${f?F(a*k,b*k):F(a+k,b+k)}`;st=mkS(ok);fix=mkS(true);ans=[a*k,b*k];why=`같은 크기 분수를 만들 때는 위아래에 <b>같은 수(${k})</b>를 곱해요. 더하면 크기가 달라져요`;
  layout=bx=>`${F(a,b)} = <span class="frac big"><span class="num">${bx[0]}</span><span class="den">${b*k}</span></span>`;check=v=>v[0]===a*k;
  pic=`<div class="simp">${pz({d:b,parts:[[a,COL[0]]],size:100})}<span>=</span>${pz({d:b*k,parts:[[a*k,COL[0]]],size:100})}</div>`;}
 else{const d=rnd(3,maxD);const n=rnd(d+1,2*d-1);const W=1,r=n-d;const wr=Math.random()<.5?[2,r]:[1,d-r];
  const mkS=f=>`${F(n,d)} = <span class="mixed">${f?W:wr[0]}${F(f?r:wr[1],d)}</span>`;st=mkS(ok);fix=mkS(true);ans=[W,r];why=`${d}/${d} 가 한 판이에요. 한 판을 빼고 남은 조각을 세어요`;
  layout=bx=>`${F(n,d)} = <span class="mixed">${bx[0]}<span class="frac big"><span class="num">${bx[1]}</span><span class="den">${d}</span></span></span>`;check=v=>v[0]===W&&v[1]===r;
  pic=`<div class="simp">${pz({d:d,parts:[[d,COL[0]]],size:90})}<span>+</span>${pz({d:d,parts:[[r,COL[0]]],size:90})}</div>`;}
 return{type,ok,st,fix,ans,why,layout,check,pic,nf:type===4?1:2};}
const DET={id:'det',emoji:'🕵️',title:'분수 탐정',desc:'계산이 맞는지 틀린지 찾아내고 바로잡아요',
 gen(){const types=shuffle([1,2,3,4,5]);let oks=shuffle([true,true,false,false,false]);return types.map((t,i)=>{const seed=rnd(1,2e9);const p=withSeed(seed,()=>mkDet(t,oks[i]));p.seed={type:t,ok:oks[i],seed};return p;});},
 render(p,el){let slips=0;
  el.innerHTML=`<div class="msg" id="msg">이 계산, <b>맞을까 틀릴까</b>? 잘 살펴보고 골라 봐 🔍</div>

   if(j!==p.ok){slips++;snd.bad();b.classList.add('shake');msg(p.ok?'다시 잘 봐. 사실은 맞는 계산이에요!':'다시 잘 봐. 어딘가 이상하지 않아?','bad');return;}
   snd.pop();$('#judge',el).innerHTML='';
   if(p.ok){msg('맞아요, 정확한 계산이에요! 👍','good');setTimeout(()=>roundDone(Math.max(1,3-slips),`${p.pic}<div class="eqline" style="font-size:28px;margin-bottom:6px">${p.fix}</div><span style="font-size:20px;color:var(--sub)">${p.why}</span>`),700);return;}
   msg('맞아, 틀린 계산이야! 🕵️ 그럼 <b>진짜 답</b>은?');
   const A=makeAnswer($('#ans',el),p.nf,bx=>`<span class="eqline" style="font-size:30px">${p.layout(bx)}</span>`,v=>{
    if(p.check(v)){$('#ans',el).innerHTML='';snd.ok();roundDone(Math.max(1,3-slips),`${p.pic}<div class="eqline" style="font-size:28px;margin-bottom:6px">${p.fix}</div><span style="font-size:20px;color:var(--sub)">${p.why}</span>`);}
    else{slips++;snd.bad();A.shake();A.clear();msg(p.why,'bad');}});});}
};

 gen(){const T=()=>rnd(1,9)/10,H=()=>rnd(1,99)/100,R=v=>Math.round(v*100)/100;
  const uniq3=()=>{const out=[];let g=0;while(out.length<3&&g++<200){const v=R(Math.random()<.5?T():H());if(!out.some(x=>Math.abs(x-v)<.03))out.push(v);}return out;};

  const c=rnd(4,9)/10,d=R(c-rnd(1,5)/100),e=R(c-rnd(2,3)/10);const u1=shuffle([c,d,e]);probs.push({fs:u1,lab:u1.map(dstr),pics:true,k:3,eq:false});
  let u=uniq3();probs.push({fs:u,lab:u.map(dstr),pics:false,k:3,eq:false});
  if(Math.random()<.5){const e=T();probs.push({fs:[e,e],lab:[dec(e,1),dec(e,2)],pics:false,k:2,eq:true});}else{let x=T(),y;do{y=H();}while(Math.abs(x-y)<.03);probs.push({fs:[x,y],lab:[dstr(x),dstr(y)],pics:false,k:2,eq:true});}
  u=uniq3();probs.push({fs:u,lab:u.map(dstr),pics:false,k:3,eq:false});return probs;},
 render(p,el){const{fs,lab,pics,k,eq}=p;const same=fs[0]===fs[1];const order=fs.map((f,i)=>i).sort((i,j)=>fs[j]-fs[i]);let next=0,tries=0;

  <div class="cmpwrap">${fs.map((f,i)=>`<button class="cmp" data-i="${i}">${pics?grid100(Math.round(f*100),COL[i],'mid'):''}<div class="nolab">${lab[i]}</div></button>`).join('')}</div>${eq?`<div class="center"><button class="btn g" id="eqBtn">같아요 =</button></div>`:''}`;

  const eb=$('#eqBtn',el);if(eb)eb.onclick=()=>{if(same){snd.pop();$$('.cmp',el).forEach(x=>x.classList.add('pick'));finish();}else{tries++;snd.bad();eb.classList.add('shake');$('#msg',el).innerHTML=`<span style="color:var(--bad)">같지 않아요. 둘 다 100칸으로 바꿔 봐: ${fs.map(v=>dec(v,2)).join(' 과 ')}</span>`;}};
  $$('.cmp',el).forEach(btn=>btn.onclick=()=>{const i=+btn.dataset.i;if(btn.classList.contains('pick'))return;
   if(same){tries++;snd.bad();btn.classList.add('shake');$('#msg',el).innerHTML=`<span style="color:var(--bad)">음, ${lab[0]} 과 ${lab[1]} 은 사실 같은 크기예요! (뒤에 붙은 0은 크기를 바꾸지 않아요)</span>`;return;}
   if(i===order[next]){snd.pop();btn.classList.add('pick');btn.insertAdjacentHTML('afterbegin',`<span class="rank">${k===2?'더 커!':next+1+'등'}</span>`);next++;if(next>=(k===2?1:k))finish();}
   else{tries++;snd.bad();btn.classList.remove('shake');void btn.offsetWidth;btn.classList.add('shake');const g=fs[order[next]];$('#msg',el).innerHTML=`<span style="color:var(--bad)">${lab[i]} 보다 큰 게 있어요. ${lab[i].length>lab[order[next]].length?'숫자가 길다고 큰 게 아니에요! ':''}소수점 바로 뒤 숫자부터 비교해 봐</span>`;}});}

/* ---------- D8: 소수 탐정 ---------- */
function mkDDet(type,ok){let st,fix,ans,why,intMax=9,pic='';const D=(v,pl)=>`<b>${dec(v,pl)}</b>`;
 if(type===1){const a=rnd(1,9),b=rnd(1,9),c=rnd(1,9);const right=(a*10+b*10+c)/100,wrong=(a+b*10+c)/100;const mk=f=>`${D(a/10,1)} + ${D((b*10+c)/100,2)} = ${D(f?right:wrong,2)}`;st=mk(ok);fix=mk(true);ans=right;why=`${dec(a/10,1)} 은 ${dec(a/10,2)} 이에요. 소수점을 맞춰서 ${dec(a/10,2)} + ${dec((b*10+c)/100,2)} 로 더해요`;pic=`<div class="simp">${grid100(a*10,COL[0],'tiny2')}<span>+</span>${grid100(b*10+c,COL[1],'tiny2')}</div>`;}
 else if(type===2){const x=rnd(5,9)/10;const y=rnd(10,49)/100;const mk=f=>f?`${D(x,1)} 이 ${D(y,2)} 보다 커요`:`${D(y,2)} 가 ${D(x,1)} 보다 커요`;st=mk(ok);fix=mk(true);ans=x;why=`숫자가 길다고 큰 게 아니에요. ${dec(x,1)} 은 ${dec(x,2)}, 100칸 중 ${Math.round(x*100)}칸!`;pic=`<div class="simp">${grid100(Math.round(x*100),COL[0],'tiny2')}<span>></span>${grid100(Math.round(y*100),COL[1],'tiny2')}</div>`;}
 else if(type===3){const q=pick([[1,2,.5,.2],[1,4,.25,.4],[3,4,.75,.34],[1,5,.2,.5],[3,10,.3,.03],[1,10,.1,.01]]);const mk=f=>`${frac(q[0],q[1])} = ${D(f?q[2]:q[3],f?(Math.round(q[2]*100)%10===0?1:2):(Math.round(q[3]*100)%10===0?1:2))}`;st=mk(ok);fix=mk(true);ans=q[2];why=`${q[0]}/${q[1]} 은 100칸 중 ${Math.round(q[2]*100)}칸 → ${dec(q[2],2)}`;pic=`<div class="simp">${pz({d:q[1],parts:[[q[0],COL[0]]],size:90})}<span>=</span>${grid100(Math.round(q[2]*100),COL[0],'tiny2')}</div>`;}
 else if(type===4){const t=rnd(1,9);const mk=f=>`${D(t/10,1)} = ${f?D(t/10,2):D(t/100,2)}`;st=mk(ok);fix=mk(true);ans=t/10;why=`뒤에 0을 붙여도 크기는 같아요: ${dec(t/10,1)} = ${dec(t/10,2)}. 하지만 ${dec(t/100,2)} 은 100칸 중 ${t}칸뿐!`;pic=`<div class="simp">${grid100(t*10,COL[0],'tiny2')}<span>=</span>${bar10(t,COL[0])}</div>`;}
 else{const W=rnd(1,4),t=rnd(1,9),v=W+t/10;if(Math.random()<.5){const mk=f=>`${D(v,1)} × 10 = ${f?`<b>${W*10+t}</b>`:D(v,2)}`;st=mk(ok);fix=mk(true);ans=W*10+t;why=`10배 하면 소수점이 오른쪽으로 한 칸! ${dec(v,1)} → ${W*10+t}`;intMax=99;}else{const mk=f=>`${D(v,1)} ÷ 10 = ${f?D(v/10,2):D(v,2)}`;st=mk(ok);fix=mk(true);ans=v/10;why=`10으로 나누면 소수점이 왼쪽으로 한 칸! ${dec(v,1)} → ${dec(v/10,2)}`;}}
 return{type,ok,st,fix,ans,why,intMax,pic};}
const DDET={id:'ddet',emoji:'🕵️',title:'소수 탐정',desc:'0.5 + 0.25 = 0.30? 길면 큰 수? 틀린 계산을 찾아내요',
 gen(){const types=shuffle([1,2,3,4,5]),oks=shuffle([true,true,false,false,false]);return types.map((t,i)=>{const seed=rnd(1,2e9);const p=withSeed(seed,()=>mkDDet(t,oks[i]));p.seed={type:t,ok:oks[i],seed};return p;});},
 render(p,el){let slips=0;
  el.innerHTML=`<div class="msg" id="msg">이 말이 <b>맞을까 틀릴까</b>? 잘 살펴보고 골라 봐 🔍</div><div class="detcase"><div class="eqline" style="font-size:34px">${p.st}</div><div class="judge" id="judge"><button class="btn yes" data-j="1">맞아 ✓</button><button class="btn no" data-j="0">틀려 ✗</button></div></div><div id="ans"></div>`;
  const msg=(h,cls='')=>{const m=$('#msg',el);m.className='msg '+cls;m.innerHTML=h;};
  const fbHtml=()=>`${p.pic}<div class="eqline" style="font-size:28px;margin-bottom:6px">${p.fix}</div><span style="font-size:20px;color:var(--sub)">${p.why}</span>`;
  $$('#judge button',el).forEach(b=>b.onclick=()=>{const j=b.dataset.j==='1';
   if(j!==p.ok){slips++;snd.bad();b.classList.add('shake');msg(p.ok?'다시 잘 봐. 사실은 맞는 말이에요!':'다시 잘 봐. 어딘가 이상하지 않아?','bad');return;}
   snd.pop();$('#judge',el).innerHTML='';
   if(p.ok){msg('맞아요, 정확해요! 👍','good');setTimeout(()=>roundDone(Math.max(1,3-slips),fbHtml()),700);return;}
   msg(p.type===2?'맞아, 틀렸어! 🕵️ 그럼 <b>더 큰 수</b>는? (소수 둘째 자리까지 써요)':'맞아, 틀린 계산이야! 🕵️ 그럼 <b>진짜 답</b>은? (소수 둘째 자리까지 써요)');
   const A=decAnswer($('#ans',el),p.ans,2,()=>{$('#ans',el).innerHTML='';snd.ok();roundDone(Math.max(1,3-slips),fbHtml());},()=>{slips++;snd.bad();A.shake();A.clear();msg(p.why,'bad');},p.intMax);});}
};

const FGAMES=[EQ,CUT,ADD,OVER,CMP,JUMP,SUB,DET],DGAMES=[TEN,PAIR,RULER,DCMP,PLACE,DADD,POUR,DDET];
const SECS=[{id:'frac',emoji:'🍕',title:'분수',games:FGAMES},{id:'dec',emoji:'🔢',title:'소수점',games:DGAMES}];
const GAMES=[...FGAMES,...DGAMES];
const NEWG=new Set(['ten','pair','ruler','dcmp','place','dadd','pour','ddet']),HARD=new Set(['sub','det','ddet']);

/* ---------- gacha ---------- */
const STK=[
 ...'🐶🐱🐰🐹🐻🐼🐨🐸🐤🐧🐢🐙🍎🍌🍉🍓🍒🍑🥕🌽🍕🍔🍩🍪🧁🍭🍦🍿'.match(/./gu).map(e=>[e,1]),
 ...'🦊🦁🐯🦒🦘🐬🦋🦜🍰🎂🍫🍬🌟⚽🎸🎨'.match(/./gu).map(e=>[e,2]),
 ...['🦄','🐉','🌈','🏆','👑','🚀'].map(e=>[e,3])];
const RNAME={1:'보통',2:'반짝',3:'전설'};
function renderGacha(){$('#gTix').textContent=S.tickets;$('#stGrid').innerHTML=STK.map(([e,r],i)=>{const n=S.stickers[i]||0;return`<div class="st ${n?'':'lock'} r${r}">${e}${r>1&&n?`<span class="sp">${r===3?'👑':'✨'}</span>`:''}${n>1?`<span class="n">×${n}</span>`:''}</div>`;}).join('');}
$('#drawBtn').onclick=async()=>{if(S.tickets<1){snd.bad();const g=$('.gtop2');g.classList.remove('shake');void g.offsetWidth;g.classList.add('shake');$('#reveal').innerHTML=`<div class="got"><div class="n">별 10개를 모으면 표 1장을 받아요. 지금 별 ${S.stars}개 → ${10-S.stars%10}개 더!</div></div>`;return;}
 S.tickets--;save();snd.tap();const btn=$('#drawBtn');btn.disabled=true;$('#reveal').innerHTML='<div class="capsule">🥚</div>';await sleep(1100);
 const roll=Math.random();const r=roll<.05?3:roll<.3?2:1;const pool=STK.map((s,i)=>[s,i]).filter(([s])=>s[1]===r);const un=pool.filter(([s,i])=>!S.stickers[i]);const[s,i]=pick(un.length?un:pool);
 S.stickers[i]=(S.stickers[i]||0)+1;save();r===3?snd.fan():snd.ok();if(r>1)confetti();
 $('#reveal').innerHTML=`<div class="got"><div class="e">${s[0]}</div><span class="rar r${r}">${RNAME[r]}</span><div class="n">${S.stickers[i]>1?`또 뽑았다! ×${S.stickers[i]}`:'새 스티커!'}</div></div>`;renderGacha();btn.disabled=false;};

/* ---------- adult ---------- */
let gateOk=false;
const PIN='19900216';
function renderAdult(){const el=$('#adultBody');if(!gateOk){let pin='';
  el.innerHTML=`<div class="set"><h4>어른 확인<small>비밀번호 ${PIN.length}자리를 눌러 주세요</small></h4></div><div class="pinwrap"><div class="pindots" id="pindots"></div><div class="np pinpad">${[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(k=>`<button data-k="${k}" class="${k==='✓'?'ok':k==='⌫'?'del':''}">${k}</button>`).join('')}</div></div>`;
  const draw=()=>{$('#pindots').innerHTML=Array.from({length:PIN.length},(_,i)=>`<i class="${i<pin.length?'f':''}"></i>`).join('');};draw();
  $$('.pinpad button',el).forEach(b=>b.onclick=()=>{const k=b.dataset.k;snd.tap();
   if(k==='⌫')pin=pin.slice(0,-1);else if(k==='✓'){if(pin===PIN){gateOk=true;snd.ok();renderAdult();return;}snd.bad();const w=$('.pinwrap',el);w.classList.remove('shake');void w.offsetWidth;w.classList.add('shake');pin='';}
   else if(pin.length<PIN.length)pin+=k;draw();if(pin.length===PIN.length&&pin===PIN){gateOk=true;snd.ok();renderAdult();}});return;}
 const seg=(key,opts,fmt=v=>v)=>`<div class="seg">${opts.map(v=>`<button data-key="${key}" data-v="${v}" class="${String(S.set[key])===String(v)?'on':''}">${fmt(v)}</button>`).join('')}</div>`;
 el.innerHTML=`<div class="set"><h4>분모 범위<small>조각 맞추기·한 판 넘기기에서 쓰는 가장 큰 분모</small></h4>${seg('maxD',[6,8,10,12],v=>'~'+v)}</div>
 <div class="set"><h4>답 직접 입력<small>끄면 그림만 조작하고 답은 자동으로 보여 줘요</small></h4>${seg('input',[true,false],v=>v===true?'켬':'끔')}</div>
 <div class="set"><h4>오늘 목표 판 수<small>달성하면 뽑기 표 1장 보너스</small></h4>${seg('goal',[1,2,3,4,5],v=>v+'판')}</div>
 <div class="set"><h4>소리</h4>${seg('sound',[true,false],v=>v===true?'켬':'끔')}</div>
 <div class="set"><h4>아이 이름</h4><input class="nm" id="nm" value="${S.set.name}" maxlength="6"></div>
 <div class="set" style="flex-direction:column;align-items:stretch"><h4>개념별 기록<small>첫 번에 맞힌 횟수 / 푼 횟수 · 🔁 다시 풀 문제 수. 80% 아래면 그 게임을 더 하면 좋아요</small></h4>${SECS.map(sc=>`<div style="font-size:17px;color:var(--sub);margin-top:8px">${sc.emoji} ${sc.title}</div><div class="statgrid">${sc.games.map(g=>{const st=S.stat[g.id];const w=S.wrong.filter(x=>x.g===g.id).length;const pct=st&&st.n?Math.round(st.ok/st.n*100):null;return`<div class="strow"><span>${g.emoji} ${g.title}</span><span><b style="color:${pct==null?'#b9a98f':pct>=80?'var(--ok)':pct>=50?'#f9a825':'var(--bad)'}">${st?`${st.ok}/${st.n} (${pct}%)`:'아직'}</b>${w?' · 🔁 '+w:''}</span></div>`;}).join('')}</div>`).join('')}<div style="margin-top:10px"><button class="btn g sm" id="clearWrong">틀린 문제 목록 비우기 (${S.wrong.length}개)</button></div></div>
 <div class="set"><h4>기록<small>별 ${S.stars} · 표 ${S.tickets} · 스티커 ${Object.keys(S.stickers).length}종</small></h4><button class="btn g sm" id="reset">모두 지우기</button></div>
 <div class="set" style="color:var(--sub);font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:500">분수 추천 순서: 같은 크기 찾기 → 피자 자르기 → 조각 맞추기 → 한 판 넘기기 → 누가 더 커 → 개구리 점프 → 초콜릿 나눠 주기 → 분수 탐정.<br>소수점 추천 순서: 칸 색칠하기(0.1·0.01) → 분수 소수 짝꿍 → 자 읽기 → 소수 누가 더 커 → 자릿값 블록 → 소수 더하기 → 주스 따르기 → 소수 탐정.<br>별 10개 = 뽑기 표 1장, 한 판 만점(15)이면 표 1장 보너스.</div>`;
 $$('.seg button',el).forEach(b=>b.onclick=()=>{const k=b.dataset.key;let v=b.dataset.v;if(v==='true')v=true;else if(v==='false')v=false;else v=+v;S.set[k]=v;save();snd.tap();renderAdult();});
 $('#nm').onchange=e=>{S.set.name=e.target.value.trim()||'재윤';save();};
 $('#clearWrong').onclick=()=>{S.wrong=[];save();snd.tap();renderAdult();};
 let rc=0;$('#reset').onclick=()=>{rc++;if(rc<2){$('#reset').textContent='정말요? 한 번 더';return;}localStorage.removeItem(KEY);S=load();save();gateOk=false;renderAdult();};}

/* ---------- boot ---------- */
checkDay();syncHead();show('home');
window.__frac={get S(){return S},startGame,startRetry,get G(){return G}};
</script>
